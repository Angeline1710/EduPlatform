services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edu_platform
      POSTGRES_USER: edu_platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_platform -d edu_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://edu_platform:local-development-only@db:5432/edu_platform?schema=public"
      AUTH_TRUST_HOST: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"

volumes:
  node_modules:
  postgres_data:
